name: exécutables

# Compile l'exécutable du jeu pour chaque système et le dépose dans la publication « binaires »,
# en deux archives par système, chacune avec son empreinte SHA-256 (.sha256) :
# - royaumes-<système>.tar.gz (.zip sous Windows) : l'exécutable seul, que scripts/binaires.sh et
#   scripts/binaires.cmd prennent sur un clone git sans cargo (Raspberry Pi, PC sans Rust) ;
# - web_royaumes-prod-<système> : la production, sans git ni sources — bin/, la page (web/),
#   demarrer_WEB_ROYAUMES.*, scripts/, README. Jamais les données de l'utilisateur (saves/). C'est
#   l'archive que la copie de production cherche pour se mettre à jour (web_tools_commun::production).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compiler:
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl : exécutables statiques, indépendants de la glibc du poste (Raspberry Pi OS)
          - { os: ubuntu-latest, cible: x86_64-unknown-linux-musl, nom: linux-x86_64 }
          - { os: ubuntu-24.04-arm, cible: aarch64-unknown-linux-musl, nom: linux-aarch64 }
          - { os: macos-latest, cible: aarch64-apple-darwin, nom: macos-aarch64 }
          - { os: windows-latest, cible: x86_64-pc-windows-msvc, nom: windows-x86_64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - run: rustup target add ${{ matrix.cible }}

      - if: contains(matrix.cible, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      # --locked : Cargo.lock doit être complet (exécutables reproductibles)
      - run: cargo build --locked --release -p royaumes --bins --target ${{ matrix.cible }}

      - name: Archive (les exécutables et le commit dont ils viennent)
        shell: bash
        run: |
          mkdir bin
          cd target/${{ matrix.cible }}/release
          if [ "${{ runner.os }}" = Windows ]; then
            cp ./*.exe ../../../bin/
          else
            find . -maxdepth 1 -type f -perm -u+x -exec cp {} ../../../bin/ \;
          fi
          cd ../../..
          git rev-parse HEAD > bin/commit
          if [ "${{ runner.os }}" = Windows ]; then
            (cd bin && 7z a ../royaumes-${{ matrix.nom }}.zip .)
          else
            tar -czf royaumes-${{ matrix.nom }}.tar.gz -C bin .
          fi

      - name: Archive de production (exécutable, page, scripts de démarrage)
        shell: bash
        run: |
          P=prod/web_royaumes
          mkdir -p $P
          cp -r bin scripts web demarrer_WEB_ROYAUMES.sh demarrer_WEB_ROYAUMES.cmd README.md $P/
          if [ "${{ runner.os }}" = Windows ]; then
            (cd prod && 7z a ../web_royaumes-prod-${{ matrix.nom }}.zip web_royaumes)
          else
            tar -czf web_royaumes-prod-${{ matrix.nom }}.tar.gz -C prod web_royaumes
          fi

      # Avant la publication : décompressée dans un dossier vide, l'archive démarre et sert la page.
      - name: Essai de l'archive de production (dossier vide, démarrage, page en 200)
        if: matrix.nom == 'linux-x86_64'
        shell: bash
        run: |
          essai=$(mktemp -d)
          tar -xzf web_royaumes-prod-linux-x86_64.tar.gz -C "$essai"
          cd "$essai/web_royaumes"
          test ! -e .git && test ! -e Cargo.toml && test ! -e rust && test ! -e saves
          setsid sh demarrer_WEB_ROYAUMES.sh --no-update --local --port 18795 --no-browser > journal.txt 2>&1 < /dev/null &
          groupe=$!
          code=000
          for i in $(seq 1 30); do
            code=$(curl -s -m 10 -o /dev/null -w '%{http_code}' http://127.0.0.1:18795/ || true)
            [ "$code" = 200 ] && break
            sleep 1
          done
          kill -TERM -- -$groupe 2>/dev/null || true
          if [ "$code" != 200 ]; then
            echo "La page ne répond pas (code $code). Journal :"; cat journal.txt; exit 1
          fi
          echo "archive de production : démarrée, page en 200, arrêtée"

      - name: Publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # les quatre compilations arrivent ensemble : une seule crée la publication
          gh release view binaires >/dev/null 2>&1 \
            || gh release create binaires --title "Exécutables" \
                 --notes "Exécutables du jeu, recompilés à chaque envoi sur main. royaumes-<système> : pris par scripts/binaires.sh et scripts/binaires.cmd. web_royaumes-prod-<système> : la production complète (exécutable, page, scripts de démarrage), à décompresser puis lancer par demarrer_WEB_ROYAUMES." \
            || true
          for f in royaumes-${{ matrix.nom }}.* web_royaumes-prod-${{ matrix.nom }}.*; do
            (sha256sum "$f" 2>/dev/null || shasum -a 256 "$f") | cut -d" " -f1 > "$f.sha256"
          done
          gh release upload binaires royaumes-${{ matrix.nom }}.* web_royaumes-prod-${{ matrix.nom }}.* --clobber
